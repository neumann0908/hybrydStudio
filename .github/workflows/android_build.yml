name: HybridStudio Vulkan Engine CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Preparar SDK de Android y aceptar licencias
      shell: bash
      run: |
        mkdir -p "$ANDROID_SDK_ROOT"
        export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

        if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
          echo "Instalando cmdline-tools y platform-tools..."
          yes | sdkmanager --install "cmdline-tools;latest" "platform-tools" || true
        fi

        echo "Aceptando licencias del SDK de Android..."
        yes | sdkmanager --licenses --sdk_root="$ANDROID_SDK_ROOT" || true

        echo "Instalando NDK y CMake requeridos..."
        sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install "ndk;25.1.8937393" "cmake;3.22.1" || true

    - name: Configurar Gradle 8.1.1
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    - name: Compilar APK Debug
      run: gradle assembleDebug --info --stacktrace

    - name: Guardar APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
